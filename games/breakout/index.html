<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="挥动球拍弹起小球，打破所有砖块，挑战三关！" />
    <meta name="theme-color" content="#7655d6" />
    <title>打砖块｜六六游戏屋</title>
    <link rel="stylesheet" href="game.css" />
    <link rel="stylesheet" href="../../assets/css/game-viewport.css" />
  </head>
  <body data-game="breakout">
    <main class="app-shell">
      <header class="topbar">
        <a class="back-link" href="../../index.html" aria-label="返回游戏大厅">← <span>游戏大厅</span></a>
        <div class="brand"><span class="brand-mark" aria-hidden="true">🧱</span><span>打砖块</span></div>
        <span class="round-badge">三关挑战</span>
      </header>

      <section class="game-card" aria-labelledby="gameTitle">
        <div class="scoreboard" aria-label="本局成绩">
          <div><span>关卡</span><strong id="levelValue">1 / 3</strong></div>
          <div><span>得分</span><strong id="scoreValue">0</strong></div>
          <div><span>生命</span><strong id="livesValue">♥ ♥ ♥</strong></div>
        </div>

        <div class="board-stage" id="gameStage">
          <canvas id="gameCanvas" class="game-canvas" width="1000" height="600" tabindex="0" role="img" aria-label="打砖块游戏场地。使用左右方向键或 A、D 移动球拍，空格键发球或暂停；也可以拖动球拍。"></canvas>
          <section id="overlayPanel" class="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
            <div class="panel-icon" aria-hidden="true">🧱</div>
            <p class="eyebrow">BOUNCE & BREAK</p>
            <h1 id="panelTitle">准备好开球了吗？</h1>
            <p id="panelMessage" class="panel-copy">移动球拍接住小球，清除砖块进入下一关。</p>
            <button id="panelButton" class="primary-button" type="button">开始发球 <span aria-hidden="true">▶</span></button>
            <p class="mini-tip">键盘：← → 或 A / D　·　空格：发球 / 暂停<br />触屏：拖动下方球拍，点击开始</p>
          </section>
        </div>

        <div class="game-controls" aria-label="游戏控制">
          <button id="leftButton" class="control-button" type="button" aria-label="球拍向左移动">← <span>左移</span></button>
          <p id="liveStatus" class="control-tip" aria-live="polite">拖动球拍，接住弹回的小球！</p>
          <button id="pauseButton" class="control-button" type="button" disabled>Ⅱ <span>暂停</span></button>
          <button id="rightButton" class="control-button" type="button" aria-label="球拍向右移动">→ <span>右移</span></button>
          <button id="restartButton" class="control-button" type="button">↻ <span>重开</span></button>
        </div>
      </section>
      <p class="footer-tip">球拍接得稳，砖块就会一块块消失 ✨</p>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
