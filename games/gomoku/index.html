<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="和朋友或电脑来一局轻松有趣的五子棋。" />
    <meta name="theme-color" content="#7957d5" />
    <title>五子棋｜六六游戏屋</title>
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="back-link" href="../../index.html" aria-label="返回游戏大厅">← <span>游戏大厅</span></a>
        <div class="brand"><span class="brand-piece" aria-hidden="true">●</span><span>五子棋</span></div>
        <button id="soundButton" class="icon-button" type="button" aria-label="关闭声音" title="声音开关">🔊</button>
      </header>

      <section class="game-card" aria-labelledby="gameTitle">
        <div class="scoreboard">
          <div class="player-card active" id="blackCard"><span class="stone black"></span><span><small>黑棋</small><strong id="blackName">玩家一</strong></span></div>
          <div class="turn-status"><span id="modeBadge">人人对战</span><strong id="turnText" aria-live="polite">黑棋回合</strong></div>
          <div class="player-card" id="whiteCard"><span><small>白棋</small><strong id="whiteName">玩家二</strong></span><span class="stone white"></span></div>
        </div>

        <div class="board-stage">
          <canvas id="board" width="720" height="720" tabindex="0" aria-label="十五乘十五五子棋棋盘。使用方向键移动，按回车或空格落子。"></canvas>
          <div id="modePanel" class="overlay-panel">
            <div class="mascot" aria-hidden="true">🐼</div>
            <p class="eyebrow">快乐棋局</p>
            <h1 id="gameTitle">选择对战方式</h1>
            <div class="choice-row" aria-label="游戏模式">
              <button class="choice-button selected" data-mode="pvp" type="button" aria-pressed="true">👥 人人对战</button>
              <button class="choice-button" data-mode="ai" type="button" aria-pressed="false">🤖 人机对战</button>
            </div>
            <div id="difficultyGroup" class="difficulty hidden" aria-label="电脑难度">
              <span>选择难度</span>
              <div class="segmented">
                <button data-difficulty="easy" type="button" aria-pressed="false">简单</button>
                <button class="selected" data-difficulty="medium" type="button" aria-pressed="true">中等</button>
                <button data-difficulty="hard" type="button" aria-pressed="false">困难</button>
              </div>
            </div>
            <button id="startButton" class="primary-button" type="button"><span aria-hidden="true">▶</span> 开始游戏</button>
            <div class="mini-tip">先连成五颗棋子的一方获胜</div>
          </div>

          <div id="resultPanel" class="overlay-panel hidden" aria-live="polite">
            <div id="resultEmoji" class="result-emoji" aria-hidden="true">🎉</div>
            <p class="eyebrow">本局结果</p>
            <h2 id="resultTitle">黑棋获胜！</h2>
            <p id="resultMessage">漂亮的五连，太厉害啦！</p>
            <div class="result-actions">
              <button id="restartButton" class="primary-button" type="button">再玩一局</button>
              <button id="resultModeButton" class="secondary-button" type="button">更换模式</button>
            </div>
          </div>
        </div>

        <div class="controls" aria-label="对局操作">
          <button id="undoButton" class="control-button" type="button" disabled>↶ <span>悔棋</span></button>
          <p class="control-tip">点击交叉点落子<br /><span>键盘可用方向键 + 回车</span></p>
          <button id="restartControl" class="control-button" type="button">↻ <span>重开</span></button>
          <button id="modeButton" class="control-button" type="button">⚙ <span>模式</span></button>
        </div>
      </section>
      <p class="footer-tip">沉着思考，每一步都可能是胜利的关键 ✨</p>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
