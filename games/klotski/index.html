<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="移动棋子，为曹操打开通往棋盘底边的出口。" />
    <meta name="theme-color" content="#7655d6" />
    <title>华容道｜六六游戏屋</title>
    <link rel="stylesheet" href="game.css" />
    <link rel="stylesheet" href="../../assets/css/game-viewport.css" />
  </head>
  <body data-game="klotski">
    <main class="app-shell">
      <header class="topbar">
        <a class="back-link" href="../../index.html" aria-label="返回游戏大厅">← <span>游戏大厅</span></a>
        <div class="brand"><span class="brand-mark" aria-hidden="true">🀄</span><span>华容道</span></div>
        <span class="round-badge">曹操快逃</span>
      </header>

      <section class="game-card" aria-labelledby="gameTitle">
        <div class="scoreboard">
          <div><span>挑战</span><strong id="levelValue">横刀立马 · 1 / 3</strong></div>
          <div><span>步数</span><strong id="moveValue">0</strong></div>
        </div>

        <div class="board-stage">
          <div id="board" class="board klotski-board" role="grid" aria-label="华容道棋盘，使用方向按钮或键盘方向键移动选中的棋子。点击棋子进行选择，也可以拖动棋子。"></div>
          <section id="resultPanel" class="overlay-panel hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
            <div class="panel-icon" aria-hidden="true">🎉</div>
            <p class="eyebrow">PUZZLE COMPLETE</p>
            <h1 id="resultTitle">曹操成功逃出！</h1>
            <p id="resultMessage" class="panel-copy"></p>
            <button id="resultButton" class="primary-button" type="button">下一关 <span aria-hidden="true">→</span></button>
          </section>
        </div>

        <div class="controls" aria-label="棋子移动与对局操作">
          <button id="upButton" class="control-button" type="button" aria-label="向上移动选中的棋子">↑</button>
          <button id="leftButton" class="control-button" type="button" aria-label="向左移动选中的棋子">←</button>
          <button id="downButton" class="control-button" type="button" aria-label="向下移动选中的棋子">↓</button>
          <button id="rightButton" class="control-button" type="button" aria-label="向右移动选中的棋子">→</button>
          <button id="undoButton" class="control-button" type="button" disabled>↶ <span>悔步</span></button>
          <button id="restartButton" class="control-button" type="button">↻ <span>重来</span></button>
          <p id="liveStatus" class="control-tip" aria-live="polite">先点选一个棋子，再点击方向按钮移动；也可以直接拖动棋子。</p>
        </div>
      </section>
      <p class="footer-tip">让棋子互相配合，为曹操打开出口 ✨</p>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
