<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7957d5" />
    <title>露露接星星</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="露露接星星">
          <span class="brand-star" aria-hidden="true">★</span>
          <span>露露接星星</span>
        </div>
        <button id="soundButton" class="icon-button" type="button" aria-label="关闭声音" title="声音开关">🔊</button>
      </header>

      <section class="game-card" aria-labelledby="gameTitle">
        <div class="scoreboard">
          <div class="score-item">
            <span class="score-label">得分</span>
            <strong id="score">0</strong>
          </div>
          <div class="mission">
            <span id="missionText">接住 10 颗星星就胜利！</span>
            <div class="progress-track" role="progressbar" aria-label="胜利进度" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
              <div id="progressBar" class="progress-bar"></div>
            </div>
          </div>
          <div class="score-item lives-wrap">
            <span class="score-label">爱心</span>
            <strong id="lives" aria-label="3 颗爱心">♥ ♥ ♥</strong>
          </div>
        </div>

        <div id="gameArea" class="game-area" tabindex="0" aria-label="游戏区域：用左右方向键移动篮子">
          <div class="cloud cloud-one" aria-hidden="true"></div>
          <div class="cloud cloud-two" aria-hidden="true"></div>
          <span class="tiny-star star-one" aria-hidden="true">✦</span>
          <span class="tiny-star star-two" aria-hidden="true">✦</span>
          <span class="tiny-star star-three" aria-hidden="true">✦</span>

          <div id="fallingStar" class="falling-star" aria-hidden="true">★</div>
          <div id="basket" class="basket" aria-hidden="true">
            <span class="basket-handle"></span>
            <span class="basket-body">🧺</span>
          </div>

          <div id="startPanel" class="overlay-panel">
            <div class="mascot" aria-hidden="true">🐰</div>
            <p class="eyebrow">星光任务</p>
            <h1 id="gameTitle">准备好了吗？</h1>
            <p>移动小篮子，接住从天空落下的星星！</p>
            <button id="startButton" class="primary-button" type="button">
              <span aria-hidden="true">▶</span> 开始游戏
            </button>
            <div class="mini-tip"><span aria-hidden="true">💡</span> 星星会越来越快哦</div>
          </div>

          <div id="resultPanel" class="overlay-panel hidden" aria-live="polite">
            <div id="resultEmoji" class="result-emoji" aria-hidden="true">🎉</div>
            <p class="eyebrow">本次挑战</p>
            <h2 id="resultTitle">你赢啦！</h2>
            <p id="resultMessage">你接住了 10 颗闪亮的星星！</p>
            <button id="restartButton" class="primary-button" type="button">再玩一次</button>
          </div>

          <button id="pauseButton" class="pause-button hidden" type="button" aria-label="暂停游戏">Ⅱ</button>
          <div id="pauseBadge" class="pause-badge hidden">游戏暂停</div>
        </div>

        <div class="controls" aria-label="游戏控制">
          <button id="leftButton" class="control-button" type="button" aria-label="向左移动">←</button>
          <div class="control-tip">
            <span>用键盘或按钮移动</span>
            <kbd>←</kbd><kbd>→</kbd>
          </div>
          <button id="rightButton" class="control-button" type="button" aria-label="向右移动">→</button>
        </div>
      </section>

      <p class="footer-tip">别担心漏掉星星，每一次练习都会更厉害 ✨</p>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
