<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="欢迎来到六六游戏屋，在这里挑选喜欢的小游戏，马上开始快乐挑战！" />
    <meta name="theme-color" content="#7a5bd7" />
    <title>六六游戏屋</title>
    <link rel="stylesheet" href="assets/css/home.css" />
  </head>
  <body>
    <div class="page-decoration decoration-one" aria-hidden="true"></div>
    <div class="page-decoration decoration-two" aria-hidden="true"></div>
    <main class="home-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="六六游戏屋首页">
          <span class="brand-icon" aria-hidden="true">★</span>
          <span>六六游戏屋</span>
        </a>
        <span class="header-badge"><span aria-hidden="true">✨</span> 快乐游戏时间</span>
      </header>

      <section class="hero" aria-labelledby="pageTitle">
        <div class="hero-copy">
          <p class="eyebrow">WELCOME, LITTLE PLAYER!</p>
          <h1 id="pageTitle">今天想玩什么？</h1>
          <p>挑选一个喜欢的小游戏，动动手、动动脑，开启今天的快乐挑战吧！</p>
        </div>
        <div class="hero-mascot" aria-hidden="true">
          <span class="mascot-sparkle sparkle-one">✦</span>
          <span class="mascot-sparkle sparkle-two">✦</span>
          <span class="mascot-bubble">🐰</span>
        </div>
      </section>

      <section class="games-section" aria-labelledby="gamesTitle">
        <div class="section-heading">
          <div>
            <p class="section-kicker">GAME COLLECTION</p>
            <h2 id="gamesTitle">全部游戏</h2>
          </div>
          <span class="game-count">1 个游戏</span>
        </div>

        <ul class="game-grid">
          <li>
            <a class="game-tile" href="games/catch-stars/index.html">
              <span class="cover-wrap">
                <img src="assets/images/catch-stars-cover.svg" alt="小兔子用篮子接住夜空中落下的星星" />
                <span class="play-chip" aria-hidden="true"><span>▶</span> 开始游戏</span>
              </span>
              <span class="game-info">
                <span class="game-title-row">
                  <strong>接星星</strong>
                  <span class="game-tag">反应力</span>
                </span>
                <span class="game-description">移动小篮子，接住闪亮的星星，完成星光任务！</span>
              </span>
            </a>
          </li>
        </ul>
      </section>

      <footer>更多有趣的小游戏正在准备中 <span aria-hidden="true">🌈</span></footer>
    </main>
  </body>
</html>
